<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN PANEL | BIST TRADE</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
    min-height:100vh;
    background:url('/static/bist-bg.jpg') center center no-repeat fixed;
    background-size:cover;
    font-family:Segoe UI,Arial;
    color:#e6e6e6;
    position:relative;
}
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:linear-gradient(180deg,rgba(0,0,0,.88),rgba(0,0,0,.95));
    z-index:0;
    pointer-events:none;
}
.border-wrap{
    position:relative;
    margin:40px auto;
    max-width:1500px;
    padding:3px;
    border-radius:22px;
    background:linear-gradient(90deg,#00ff88,#ff0000,#00ff88);
    background-size:300% 300%;
    animation:borderMove 6s linear infinite;
    z-index:2;
}
@keyframes borderMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}
.panel{
    background:rgba(15,23,42,.97);
    border-radius:18px;
    backdrop-filter:blur(15px);
    padding-bottom:40px;
}
.header{
    padding:20px 30px;
    font-size:22px;
    font-weight:800;
    border-bottom:1px solid #1e293b;
}
.container{padding:30px;}
.section-title{
    font-size:18px;
    font-weight:700;
    margin:40px 0 15px 0;
}
.table-wrapper{overflow-x:auto;}
.table{
    width:100%;
    border-collapse:collapse;
    background:rgba(15,23,42,.92);
    border-radius:12px;
    overflow:hidden;
    min-width:1100px;
}
.table th{
    background:#111827;
    padding:14px;
    font-size:14px;
    text-align:left;
    border-bottom:1px solid #1e293b;
}
.table td{
    padding:12px;
    font-size:13px;
    border-bottom:1px solid #1e293b;
}
.badge{
    padding:4px 10px;
    border-radius:999px;
    font-size:11px;
    font-weight:700;
}
.badge.active{ background:#14532d; color:#22c55e; }
.badge.expired{ background:#7f1d1d; color:#ef4444; }
.badge.warning{ background:#78350f; color:#fbbf24; }

input{
    padding:6px;
    border-radius:8px;
    border:none;
    background:#1f2937;
    color:#fff;
    outline:none;
}
input[type=number]{ width:70px; }
input[type=text]{ width:140px; }

button{
    padding:6px 10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:12px;
    font-weight:700;
    transition:.2s;
}
button:hover{ transform:translateY(-1px); }

.btn-add{ background:#14532d; color:#22c55e; }
.btn-sub{ background:#7f1d1d; color:#ef4444; }
.btn-delete{ background:#7f1d1d; color:#fff; }
.btn-reset{ background:#1e3a8a; color:#93c5fd; }
.btn-refresh{
    background:#2563eb;
    color:#fff;
    padding:10px 16px;
    margin-bottom:20px;
    border-radius:10px;
    font-size:14px;
}
.btn-generate{ background:#f59e0b; color:#000; }

.chatid{
    font-size:11px;
    opacity:0.8;
    word-break:break-all;
}

@media(max-width:900px){
    .container{ padding:15px; }
}
</style>
</head>
<body>

<div class="border-wrap">
<div class="panel">

<div class="header">
⚙️ BIST TRADE ADMIN PANEL
</div>

<div class="container">

<button class="btn-refresh" onclick="loadUsers()">Yenile</button>
<a href="/admin/test-signal-card" style="display:inline-block;margin-left:10px;padding:10px 16px;border-radius:10px;background:#0f766e;color:#fff;text-decoration:none;font-size:14px;font-weight:700;">Sinyal Görseli Testi</a>

<h2 class="section-title">👤 Kullanıcılar</h2>

<div class="table-wrapper">
<table class="table">
<thead>
<tr>
<th>ID</th>
<th>Kullanıcı</th>
<th>Chat ID</th>
<th>Durum</th>
<th>Abonelik Bitiş</th>
<th>Kalan Gün</th>
<th>Gün Ekle/Çıkar</th>
<th>Şifre Reset</th>
<th>Sil</th>
</tr>
</thead>
<tbody id="userTable"></tbody>
</table>
</div>

<h2 class="section-title">🎟️ Davet Kodları</h2>

<div style="margin-bottom:15px;">
<input type="number" id="codeCount" value="5">
<input type="number" id="expireDays" placeholder="Geçerlilik Gün (opsiyonel)">
<button class="btn-generate" onclick="generateCodes()">Kod Üret</button>
</div>

<div class="table-wrapper">
<table class="table">
<thead>
<tr>
<th>Kod</th>
<th>Kullanıldı mı</th>
<th>Kullanan</th>
<th>Oluşturulma</th>
<th>Sil</th>
</tr>
</thead>
<tbody id="codeTable"></tbody>
</table>
</div>

<hr>

<h2 class="section-title">⚠️ Brüt Takas Yönetimi</h2>

<div style="margin-bottom:15px;">
    <input type="text" id="brut_symbol" placeholder="Hisse (örn: ASELS)">
    <input type="date" id="brut_end">
    <button class="btn-add" onclick="addBrut()">Ekle</button>
</div>

<div class="table-wrapper">
<table class="table">
<thead>
<tr>
<th>Hisse</th>
<th>Bitiş</th>
<th>Kalan Gün</th>
<th>Tip</th>
<th>Sil</th>
</tr>
</thead>
<tbody id="brutTable"></tbody>
</table>
</div>

</div>
</div>
</div>

<script>

function formatDate(dateStr){
if(!dateStr) return "-";
const d=new Date(dateStr);
return d.toLocaleString("tr-TR");
}

function daysLeft(dateStr){
if(!dateStr) return 0;
const now=new Date();
const end=new Date(dateStr);
return Math.ceil((end-now)/(1000*60*60*24));
}

async function updateSub(userId, days){
await fetch("/admin/update-subscription",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({ user_id:userId, days:days })
});
loadUsers();
}

async function deleteUser(userId){
if(!confirm("Kullanıcı silinsin mi?")) return;

await fetch("/admin/delete-user",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({ user_id:userId })
});
loadUsers();
}

async function resetPassword(userId){
const newPass=prompt("Yeni şifre giriniz:");
if(!newPass) return;

await fetch("/admin/reset-password",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({ user_id:userId, new_password:newPass })
});

alert("Şifre güncellendi");
}

async function loadUsers(){
const res=await fetch("/admin/users");
const users=await res.json();
const tbody=document.getElementById("userTable");
tbody.innerHTML="";

users.forEach(u=>{
const days=daysLeft(u.subscription_end);

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${u.id}</td>
<td>${u.username}</td>
<td class="chatid">${u.telegram_chat_id||"-"}</td>
<td>${u.status}</td>
<td>${formatDate(u.subscription_end)}</td>
<td>${days>0?days:0}</td>
<td>
<input type="number" id="days-${u.id}" value="7">
<button class="btn-add" onclick="updateSub(${u.id}, parseInt(document.getElementById('days-${u.id}').value))">+</button>
<button class="btn-sub" onclick="updateSub(${u.id}, -parseInt(document.getElementById('days-${u.id}').value))">-</button>
</td>
<td>
<button class="btn-reset" onclick="resetPassword(${u.id})">Reset</button>
</td>
<td>
<button class="btn-delete" onclick="deleteUser(${u.id})">Sil</button>
</td>
`;

tbody.appendChild(tr);
});

loadCodes();
loadBruts();
}

async function generateCodes(){
const count=document.getElementById("codeCount").value;
const expireDays=document.getElementById("expireDays").value;

await fetch("/admin/generate-codes",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
count:count,
expire_days:expireDays
})
});

loadCodes();
}

async function loadCodes(){
const res=await fetch("/admin/invite-codes");
const codes=await res.json();
const tbody=document.getElementById("codeTable");
tbody.innerHTML="";

codes.forEach(c=>{
const tr=document.createElement("tr");
tr.innerHTML=`
<td>${c.code}</td>
<td>${c.is_used?"KULLANILDI":"AKTİF"}</td>
<td>${c.used_by||"-"}</td>
<td>${formatDate(c.created_at)}</td>
<td><button class="btn-delete" onclick="deleteCode('${c.code}')">Sil</button></td>
`;
tbody.appendChild(tr);
});
}

async function deleteCode(code){
await fetch("/admin/delete-code",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({ code:code })
});
loadCodes();
}

async function addBrut(){

    const symbolInput = document.getElementById("brut_symbol").value.trim();
    const rawDate = document.getElementById("brut_end").value;

    if(!symbolInput){
        alert("Hisse gir!");
        return;
    }

    const symbol = symbolInput.toUpperCase().replace(".IS","");

    // DATE FORMAT FIX (YYYY-MM-DD → DD.MM.YYYY)
    let end = null;

    if(rawDate){
        const parts = rawDate.split("-");
        end = `${parts[2]}.${parts[1]}.${parts[0]}`;
    }

    try{

        const res = await fetch("/admin/add-brut",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
                symbol: symbol,
                end_date: end
            })
        });

        const data = await res.json();

        if(data.status !== "ok"){
            alert("Hata oluştu");
            return;
        }

        alert(`Brüt eklendi: ${symbol}`);

        document.getElementById("brut_symbol").value="";
        document.getElementById("brut_end").value="";

        loadBruts();

    }catch(e){
        alert("Sunucu hatası");
    }
}


async function loadBruts(){

    try{

        const res = await fetch("/admin/get-bruts");
        const data = await res.json();

        const tbody = document.getElementById("brutTable");
        tbody.innerHTML="";

        if(!data || Object.keys(data).length === 0){
            tbody.innerHTML = `<tr><td colspan="5">Veri yok</td></tr>`;
            return;
        }

        Object.entries(data).forEach(([sym,val])=>{

            const tr=document.createElement("tr");

            tr.innerHTML=`
            <td>${sym.replace(".IS","")}</td>
            <td>${val.end_date || "-"}</td>
            <td>${val.days_left ?? "-"}</td>
            <td>${val.type}</td>
            <td><button class="btn-delete" onclick="deleteBrut('${sym}')">Sil</button></td>
            `;

            tbody.appendChild(tr);
        });

    }catch(e){
        console.log("Brut load error:", e);
    }
}


async function deleteBrut(symbol){

    if(!confirm(`${symbol} silinsin mi?`)) return;

    try{

        await fetch("/admin/delete-brut",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({symbol:symbol})
        });

        loadBruts();

    }catch(e){
        alert("Silme hatası");
    }
}
loadUsers();

</script>

</body>
</html>

name: Prepare BIST Migration Bridge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prepare-bist-migration-bridge.yml"

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    steps:
      - name: Configure target SSH
        env:
          KEY: ${{ secrets.BIST_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/target_key
          chmod 600 ~/.ssh/target_key

      - name: Create ephemeral migration key on dedicated BIST VM
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/target_key -o BatchMode=yes -o IdentitiesOnly=yes             -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null             ubuntu@89.168.99.141 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          install -d -m 700 /home/ubuntu/.ssh
          rm -f /home/ubuntu/.ssh/bist_migration_bridge /home/ubuntu/.ssh/bist_migration_bridge.pub
          ssh-keygen -q -t ed25519 -N ''             -C 'bist-migration-bridge-20260925'             -f /home/ubuntu/.ssh/bist_migration_bridge
          chmod 600 /home/ubuntu/.ssh/bist_migration_bridge
          chmod 644 /home/ubuntu/.ssh/bist_migration_bridge.pub
          echo 'BRIDGE_PUBLIC_KEY_BEGIN'
          cat /home/ubuntu/.ssh/bist_migration_bridge.pub
          echo 'BRIDGE_PUBLIC_KEY_END'
          REMOTE

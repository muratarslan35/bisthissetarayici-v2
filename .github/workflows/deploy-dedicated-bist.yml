name: Deploy Dedicated BIST

on:
  workflow_dispatch:
    inputs:
      send_admin_test:
        description: Send one real-data test card to ADMIN_CHAT_ID after deploy
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "*.py"
      - "deploy/**"
      - "templates/**"
      - "static/**"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/deploy-dedicated-bist.yml"

permissions:
  contents: read

concurrency:
  group: deploy-dedicated-bist
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Configure SSH
        env:
          KEY: ${{ secrets.BIST_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key

      - name: Deploy main to dedicated VM
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/key             -o BatchMode=yes -o IdentitiesOnly=yes             -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null             -o ConnectTimeout=15 -o ServerAliveInterval=20 -o ServerAliveCountMax=30 ubuntu@89.168.99.141 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          cd /home/ubuntu/bistbot

          echo "=== SYNC CODE ==="
          git fetch --prune origin
          git reset --hard origin/main
          git clean -fd \
            -e '.env' \
            -e 'system.db' \
            -e 'data/' \
            -e 'venv' \
            -e 'venv/' \
            -e '.venvs/' \
            -e 'cards/' \
            -e 'fallback_state.json' \
            -e 'successful_signals.json'
          echo "LIVE_COMMIT=$(git rev-parse HEAD)"

          echo "=== PYTHON ENV ==="
          mkdir -p .venvs
          release="$(git rev-parse --short=12 HEAD)"
          next_venv="$PWD/.venvs/$release"
          requirements_hash="$(sha256sum requirements.txt | awk '{print $1}')"
          current_venv=""
          current_hash=""
          if [ -L venv ]; then
            current_venv="$(readlink -f venv || true)"
            if [ -n "$current_venv" ] && [ -f "$current_venv/.requirements.sha256" ]; then
              current_hash="$(cat "$current_venv/.requirements.sha256")"
            fi
          fi

          if [ -n "$current_venv" ] && [ -x "$current_venv/bin/gunicorn" ] && \
             { [ "$current_hash" = "$requirements_hash" ] || [ -z "$current_hash" ]; }; then
            next_venv="$current_venv"
            printf '%s\n' "$requirements_hash" > "$next_venv/.requirements.sha256"
            echo "VENV_REUSED=1"
          else
            rm -rf "$next_venv"
            python3 -m venv "$next_venv"
            for attempt in 1 2 3; do
              if "$next_venv/bin/python" -m pip install -q --timeout 60 --retries 5 \
                   --upgrade pip setuptools wheel && \
                 "$next_venv/bin/python" -m pip install -q --timeout 60 --retries 5 \
                   -r requirements.txt; then
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo "Dependency installation failed after 3 attempts" >&2
                exit 1
              fi
              sleep $((attempt * 10))
            done
            printf '%s\n' "$requirements_hash" > "$next_venv/.requirements.sha256"
            echo "VENV_REUSED=0"
          fi
          "$next_venv/bin/python" -m compileall -q .
          echo "PYTHON_COMPILE=PASS"

          echo "=== ATOMIC VENV SWITCH ==="
          previous_target=""
          if [ -L venv ]; then
            previous_target="$(readlink -f venv || true)"
          elif [ -d venv ]; then
            legacy="$PWD/.venvs/legacy-$(date +%Y%m%dT%H%M%S)"
            mv venv "$legacy"
            previous_target="$legacy"
          fi

          if [ "$(readlink -f venv 2>/dev/null || true)" != "$next_venv" ]; then
            ln -s "$next_venv" venv.next
            mv -Tf venv.next venv
          fi
          test -x venv/bin/python
          test -x venv/bin/gunicorn
          echo "VENV_SWITCH=PASS"

          echo "=== INSTALL DEDICATED SERVICES ==="
          bash deploy/install_dedicated_vm_services.sh /home/ubuntu/bistbot

          echo "=== ONE-TIME SOURCE COOLDOWN ==="
          cooldown_marker="data/telegram-source-cooldown-20260929"
          if [ ! -f "$cooldown_marker" ]; then
            mkdir -p data
            venv/bin/python - <<'PY'
          from telegram_market_verifier import set_source_cooldown
          print("SOURCE_COOLDOWN=" + str(set_source_cooldown(
              hours=48, reason="User-reported 48-hour source ban on 2026-09-29"
          )))
          PY
            touch "$cooldown_marker"
          else
            echo "SOURCE_COOLDOWN=ALREADY_APPLIED"
          fi

          healthy=0
          for i in $(seq 1 30); do
            web=$(sudo systemctl is-active bist-trading-web.service || true)
            worker=$(sudo systemctl is-active bist-trading-worker.service || true)
            if [ "$web" = active ] && [ "$worker" = active ] && \
               curl --fail --silent --show-error --max-time 3 \
                 http://127.0.0.1:5000/health >/tmp/bist-health.json 2>/dev/null; then
              healthy=1
              break
            fi
            sleep 2
          done

          if [ "$healthy" != 1 ]; then
            echo "New release failed health check" >&2
            sudo journalctl -u bist-trading-web.service --since "5 minutes ago" --no-pager | tail -100 || true
            sudo journalctl -u bist-trading-worker.service --since "5 minutes ago" --no-pager | tail -100 || true
            if [ -n "$previous_target" ] && [ -d "$previous_target" ]; then
              rm -f venv
              ln -s "$previous_target" venv
              bash deploy/install_dedicated_vm_services.sh /home/ubuntu/bistbot || true
              echo "VENV_ROLLBACK_ATTEMPTED=1"
            fi
            exit 1
          fi

          echo "=== HEALTH ==="
          venv/bin/python - <<'PY'
          import json
          from universe_manager import universe_status
          from fast_market_lane import fast_status

          with open('/tmp/bist-health.json', encoding='utf-8') as f:
              health=json.load(f)

          print("HTTP_HEALTH=PASS")
          print("KAP_STATUS=" + str(health.get("kap_status")))
          print("UNIVERSE_STATUS=" + json.dumps(universe_status(), ensure_ascii=False))
          print("FAST_STATUS=" + json.dumps(fast_status(), ensure_ascii=False))
          PY

          echo "=== WORKER BOOT EVIDENCE ==="
          sleep 8
          sudo journalctl -u bist-trading-worker.service --since "2 minutes ago" --no-pager             | grep -E 'BIST scanner worker starting|UNIVERSE_|KAP_WATCH|FAST_|Döngü:|ERROR'             | tail -80 || true

          echo "BIST_WEB=$(sudo systemctl is-active bist-trading-web.service)"
          echo "BIST_WORKER=$(sudo systemctl is-active bist-trading-worker.service)"
          find .venvs -mindepth 1 -maxdepth 1 -type d -mtime +7 -exec rm -rf {} + 2>/dev/null || true
          echo "DEDICATED_BIST_DEPLOY=PASS"
          REMOTE

      - name: Send one real-data card to admin bot
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.send_admin_test) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[send-admin-test]')) }}
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/key \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            ubuntu@89.168.99.141 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          cd /home/ubuntu/bistbot
          set -a
          source .env
          set +a
          venv/bin/python - <<'PY'
          from app import send_env_admin_real_test_signal
          ok, detail = send_env_admin_real_test_signal()
          print("ADMIN_TEST_SENT=" + ("PASS" if ok else "FAIL"))
          print("DETAIL=" + detail)
          if not ok:
              raise SystemExit(1)
          PY
          REMOTE

      - name: Verify public browser access
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --connect-timeout 10 --max-time 20 \
            http://89.168.99.141:5000/health >/tmp/public-health.json
          curl --fail --silent --show-error --connect-timeout 10 --max-time 20 \
            -o /dev/null http://89.168.99.141:5000/login
          echo "PUBLIC_DASHBOARD_PORT=PASS"

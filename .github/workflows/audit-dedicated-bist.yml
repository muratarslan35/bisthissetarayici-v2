name: Audit Dedicated BIST VM

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-dedicated-bist.yml"

permissions:
  contents: read

# retry-marker

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Configure SSH
        env:
          KEY: ${{ secrets.BIST_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keyscan -T 5 -H 89.168.99.141 >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Read-only target audit
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/key -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 ubuntu@89.168.99.141 \
            'echo TARGET_SSH_OK; id; hostname; uname -a; nproc; free -h; df -h /'

name: Audit Dedicated BIST VM

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-dedicated-bist.yml"

permissions:
  contents: read

# retry-marker

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Configure SSH
        env:
          KEY: ${{ secrets.BIST_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keyscan -T 5 -H 89.168.99.141 >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Read-only target audit
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/key -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 ubuntu@89.168.99.141 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          echo TARGET_SSH_OK
          id
          hostname
          uname -a
          nproc
          free -h
          df -h /
          echo "BIST_WEB=$(sudo systemctl is-active bist-trading-web.service)"
          echo "BIST_WORKER=$(sudo systemctl is-active bist-trading-worker.service)"
          curl --fail --silent --show-error http://127.0.0.1:5000/health >/tmp/bist-health-audit.json
          python3 - <<'PY'
          import json
          with open('/tmp/bist-health-audit.json', encoding='utf-8') as f:
              data=json.load(f)
          print("BIST_HEALTH_HTTP=PASS")
          print("KAP_STATUS=", data.get("kap_status"))
          PY
          test "$(sudo systemctl is-active bist-trading-web.service)" = "active"
          test "$(sudo systemctl is-active bist-trading-worker.service)" = "active"

          cd /home/ubuntu/bistbot
          echo "=== LIVE MARKET ARCHITECTURE ==="
          venv/bin/python - <<'PY'
          import json
          from universe_manager import universe_status
          from fast_market_lane import fast_status
          print("UNIVERSE_STATUS=" + json.dumps(universe_status(), ensure_ascii=False))
          print("FAST_STATUS=" + json.dumps(fast_status(), ensure_ascii=False))
          PY

          echo "=== WORKER ARCHITECTURE LOGS ==="
          sudo journalctl -u bist-trading-worker.service --since "15 minutes ago" --no-pager             | grep -E 'UNIVERSE_REFRESH|UNIVERSE .*ERROR|KAP_WATCH|KAP WATCH ERROR|FAST_SIGNAL|FAST LANE ERROR|BIST scanner worker starting|Döngü:'             | tail -100 || true
          REMOTE

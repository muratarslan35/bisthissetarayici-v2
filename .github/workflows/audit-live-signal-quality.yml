name: Audit Live Signal Quality

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-live-signal-quality.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    steps:
      - name: Configure SSH
        env:
          KEY: ${{ secrets.BIST_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key

      - name: Inspect live signal stores
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/key -o BatchMode=yes -o IdentitiesOnly=yes             -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null             ubuntu@89.168.99.141 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          cd /home/ubuntu/bistbot
          venv/bin/python - <<'PY'
          import json, sqlite3
          from pathlib import Path

          db=sqlite3.connect('/home/ubuntu/bistbot/system.db')
          db.row_factory=sqlite3.Row
          cur=db.cursor()

          print("=== V3 SIGNAL COUNTS BY DAY/SCOPE ===")
          for r in cur.execute("""
            SELECT substr(created_at,1,10) day, scope, count(*) c
            FROM strategy_signals
            GROUP BY 1,2 ORDER BY day DESC, scope
            LIMIT 20
          """):
              print(dict(r))

          print("=== TODAY ALGORITHMS ===")
          for r in cur.execute("""
            SELECT algorithm, scope, count(*) c, min(created_at) first_at, max(created_at) last_at
            FROM strategy_signals
            WHERE substr(created_at,1,10)=date('now','localtime')
            GROUP BY algorithm, scope
            ORDER BY c DESC
          """):
              print(dict(r))

          print("=== RECENT 25 SIGNALS ===")
          for r in cur.execute("""
            SELECT symbol, scope, algorithm, score, entry_price, stop_loss,
                   tp1, tp2, tp3, created_at
            FROM strategy_signals
            ORDER BY id DESC LIMIT 25
          """):
              print(dict(r))

          print("=== TODAY EXTERNAL VERIFICATION SUMMARY ===")
          for r in cur.execute("""
            SELECT status, coalesce(depth_status,'NOT_REQUESTED') depth_status,
                   count(*) c
            FROM external_market_verifications
            WHERE trade_date=date('now','localtime')
            GROUP BY status, coalesce(depth_status,'NOT_REQUESTED')
            ORDER BY c DESC
          """):
              print(dict(r))

          print("=== TODAY EXTERNAL VERIFICATION SYMBOLS ===")
          for r in cur.execute("""
            SELECT symbol, status, coalesce(depth_status,'NOT_REQUESTED') depth_status,
                   requested_at, response_at,
                   CASE WHEN error IS NULL OR error='' THEN 0 ELSE 1 END theoretical_error,
                   CASE WHEN depth_error IS NULL OR depth_error='' THEN 0 ELSE 1 END depth_error
            FROM external_market_verifications
            WHERE trade_date=date('now','localtime')
            ORDER BY id
          """):
              print(dict(r))

          print("=== TODAY DEPTH IMAGE/OCR EVIDENCE ===")
          for r in cur.execute("""
            SELECT symbol, depth_status, depth_parsed_json, depth_error,
                   depth_requested_at, depth_response_at
            FROM external_market_verifications
            WHERE trade_date=date('now','localtime')
              AND depth_status IS NOT NULL
            ORDER BY id
          """):
              item=dict(r)
              raw=item.pop('depth_parsed_json', None)
              parsed={}
              try:
                  parsed=json.loads(raw or '{}')
              except Exception:
                  pass
              quality=parsed.get('quality') or {}
              totals=parsed.get('depth_totals') or {}
              header=parsed.get('header') or {}
              item.update({
                  'image_read': bool(parsed.get('image_sha256')),
                  'parser_source': parsed.get('source'),
                  'ocr_complete': bool(quality.get('complete')),
                  'valid_depth_levels': quality.get('valid_depth_levels'),
                  'trade_rows': quality.get('trade_rows'),
                  'institution_flow_rows': len(parsed.get('institution_flow') or []),
                  'market_volume': header.get('volume') or parsed.get('volume'),
                  'buy_quantity': totals.get('buy_quantity') or parsed.get('buy_total'),
                  'sell_quantity': totals.get('sell_quantity') or parsed.get('sell_total'),
                  'buy_sell_ratio': totals.get('buy_sell_ratio') or parsed.get('buy_sell_ratio'),
              })
              print(item)

          print("=== TODAY SIGNAL BOT CONTRIBUTION ===")
          for r in cur.execute("""
            SELECT symbol, scope, score, created_at,
                   CASE WHEN metadata_json LIKE '%\"bot_support\"%' THEN 1 ELSE 0 END bot_supported
            FROM strategy_signals
            WHERE substr(created_at,1,10)=date('now','localtime')
            ORDER BY id
          """):
              print(dict(r))

          print("=== TODAY SIGNAL EXECUTION TIMING ===")
          for r in cur.execute("""
            SELECT symbol, scope, created_at, metadata_json
            FROM strategy_signals
            WHERE substr(created_at,1,10)=date('now','localtime')
            ORDER BY id
          """):
              item=dict(r)
              try:
                  meta=json.loads(item.pop('metadata_json') or '{}')
              except Exception:
                  meta={}
                  item.pop('metadata_json', None)
              item.update({
                  'trigger_price': meta.get('trigger_price'),
                  'current_price': meta.get('current_price'),
                  'slippage_pct': meta.get('execution_slippage_pct'),
                  'decision_latency_sec': meta.get('decision_latency_seconds'),
                  'publish_latency_sec': meta.get('publish_latency_seconds'),
                  'quote_age_sec': meta.get('execution_quote_age_seconds'),
              })
              print(item)

          print("=== TODAY PAPER TRADE OUTCOMES ===")
          for r in cur.execute("""
            SELECT scope, algorithm, status, exit_reason, count(*) c,
                   round(avg(result_pct),3) avg_result
            FROM paper_trades
            WHERE substr(opened_at,1,10)=date('now','localtime')
            GROUP BY scope, algorithm, status, exit_reason
            ORDER BY c DESC
          """):
              print(dict(r))
          db.close()

          for name in ('data/weekly_state.json','data/daily_state.json','successful_signals.json'):
              p=Path(name)
              print(f"=== {name} exists={p.exists()} mtime={p.stat().st_mtime if p.exists() else None} ===")
              if p.exists():
                  try:
                      data=json.loads(p.read_text(encoding='utf-8'))
                      if name.endswith('weekly_state.json'):
                          weekly=data.get('weekly',{})
                          for wk,vals in weekly.items():
                              print("WEEK",wk,"COUNT",len(vals) if isinstance(vals,dict) else 'n/a')
                              if isinstance(vals,dict):
                                  for k,v in list(vals.items())[:60]:
                                      print("LEGACY",k,v)
                      elif isinstance(data,dict):
                          print("TOP_LEVEL_COUNT",len(data))
                  except Exception as e:
                      print("READ_ERROR",e)
          PY
          REMOTE

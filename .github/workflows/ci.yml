name: BIST V3 CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python sources
        run: |
          python -m compileall -q .

      - name: Validate deployment scripts
        run: |
          bash -n deploy/install_shared_host_services.sh
          bash -n scripts/check_shared_host_isolation.sh

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Live KAP source smoke
        continue-on-error: true
        run: python scripts/check_kap_live.py

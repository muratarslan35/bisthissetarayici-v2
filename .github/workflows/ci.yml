name: BIST V3 CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python sources
        run: |
          python -m compileall -q .

      - name: Validate deployment scripts
        run: |
          bash -n deploy/install_shared_host_services.sh
          bash -n scripts/check_shared_host_isolation.sh

      - name: Validate dashboard JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path("templates/dashboard.html").read_text(encoding="utf-8")
          start=html.index("<script>")+len("<script>")
          end=html.index("</script>", start)
          Path("/tmp/dashboard.js").write_text(html[start:end], encoding="utf-8")
          PY
          node --check /tmp/dashboard.js

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Live KAP source smoke
        continue-on-error: true
        run: python scripts/check_kap_live.py
